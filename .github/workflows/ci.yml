name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Byte-compile (syntax check all modules)
        run: python -m compileall -q config.py llm.py server.py pipeline editor youtube resolve

      - name: Import check (server + pipeline modules, no network/API calls)
        run: |
          python -c "
          import config
          import llm
          import server
          from pipeline import download, transcribe, highlight, render, reframe, silence, lutgen, subtitles, metadata, assist
          from editor import nl_edit
          from youtube import upload
          from resolve import push_client
          print('all modules import cleanly')
          "
